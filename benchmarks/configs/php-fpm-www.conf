[www]
user = www-data
group = www-data
listen = /tmp/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0666

; Kapasitas pekerja identik = 20 (setara 16 fast + 4 heavy di BakpiaRun)
pm = dynamic
pm.max_children = 20
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 5000

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
