server:
  host: "0.0.0.0"
  port: 8080
  https_port: 8443
  admin_token: "dev-token-for-local-testing"
  max_body_size_mb: 50
  static_cache_max_age: 31536000
  tls:
    enabled: true
    cert_path: "/home/bakpiarun-dev/bakpiarun/certs/cert.pem"
    key_path: "/home/bakpiarun-dev/bakpiarun/certs/key.pem"

php:
  binary_path: "php"
  docroot: "/home/bakpiarun-dev/bakpiarun/public"
  worker_path: "/home/bakpiarun-dev/bakpiarun/src-worker/worker.php"
  worker_count: 32
  memory_limit_mb: 128
  max_requests: 5000
  timeout_ms: 30000
  connection_pool_size: 5
  upload_tmp_dir: "/tmp/bakpiarun_uploads"
  max_payload_mb: 100
  worker_startup_delay_ms: 500
  rolling_restart_delay_ms: 200
  default_content_type: "text/html; charset=utf-8"

socket:
  directory: "/tmp/bakpiarun"

logging:
  access_log_enabled: true
  access_log: "/home/bakpiarun-dev/bakpiarun/logs/access.log"
  
  error_log_enabled: true
  error_log: "/home/bakpiarun-dev/bakpiarun/logs/error.log"
  
  level: "info"  # debug, info, warn, error
  file: "/home/bakpiarun-dev/bakpiarun/logs/bakpiarun.log"

rate_limit:
  enabled: false
  requests_per_minute: 120
  burst_size: 20

security:
  # Prevent clickjacking (DENY, SAMEORIGIN, atau ALLOW-FROM uri)
  x_frame_options: "DENY"
  
  # Prevent MIME type sniffing
  x_content_type_options: true
  
  # Enable XSS filter
  x_xss_protection: true
  
  # Content Security Policy (optional, uncomment to enable)
  # content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline'"
  
  # HTTP Strict Transport Security (optional, untuk HTTPS)
  # strict_transport_security: "max-age=31536000; includeSubDomains"
  
  # Control referrer information
  referrer_policy: "strict-origin-when-cross-origin"
  
  # Control browser features (optional)
  # permissions_policy: "geolocation=(), microphone=(), camera=()"

compression:
  enabled: true
  min_size_bytes: 1024  # Hanya compress response > 1KB
  level: 6  # 1-9 (6 = balanced)

pools:
  # HEAVY POOL DULU (lebih spesifik)
  - name: "heavy"
    worker_count: 8
    memory_limit_mb: 512
    max_requests: 100
    timeout_ms: 300000
    patterns:
      - "/heavy-db.php"
      - "/heavy-*"
      - "/api/export/*"
      - "/api/report/*"
  
  # FAST POOL TERAKHIR (catch all)
  - name: "fast"
    worker_count: 32
    memory_limit_mb: 128
    max_requests: 5000
    timeout_ms: 30000
    patterns:
      - "/*"  # Default: semua request yang gak match heavy


# Queue System Configuration
queue:
  enabled: false        # Set to false to disable queue system
  max_jobs: 10000      # Maximum jobs in queue (prevent memory overflow)
  poll_interval_ms: 500 # Polling interval for queue worker (ms)

# DB PROXY & CONNECTION POOLING
db_proxy:
  enabled: true
  listen_address: "127.0.0.1"
  listen_port: 3307
  spoof_version: "8.0.33-bakpiarun-proxy" # Fallback kalau DB asli gak bisa dibaca
  
  target:
    host: "127.0.0.1"
    port: 3306
    username: "bakpiarun_user"
    password: "password_asli_lo"
    database: "bakpiarun_db"
    
  pool:
    min_connections: 2
    max_connections: 20